name: Varbase Webform Base
description: A recipe to manage default installed webform modules, configurations, and permissions for Varbase webform experience.
type: Varbase Webform
install:
  - webform
  - webform_templates
  - webform_ui
  - webform_views
  - eca_webform
config:
  import:
    webform: '*'
    webform_templates: '*'
    webform_ui: '*'
    webform_views: '*'
  actions:
    webform.settings:
      simpleConfigUpdate:
        requirements:
          cdn: false
          clientside_validation: true
          bootstrap: true
          spam: true
    webform.webform.contact:
      simpleConfigUpdate:
        archive: true
